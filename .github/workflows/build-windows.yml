name: build-windows

env:
  MPV_VERSION: "20251214-git-f7be2ee"
  # using older version due to severe memory leak
  # https://qt-project.atlassian.net/browse/QTBUG-141377
  QT_VERSION: "6.9.3"

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: windows-x64
            qt_arch: win64_msvc2022_64
            mpv_arch: x86_64-v3
            mpv_arch_fallback: x86_64
            vc_redist_arch: x64
            vcvars: vcvars64.bat
            machine: X64
          # ARM64 disabled - requires qt webengine builds
          # - artifact: windows-arm64
          #   qt_arch: win64_msvc2022_arm64
          #   mpv_arch: aarch64
          #   mpv_arch_fallback: ""
          #   vc_redist_arch: arm64
          #   vcvars: vcvarsamd64_arm64.bat
          #   machine: ARM64
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4.4.1
      with:
        version: "${{ env.QT_VERSION }}"
        arch: "${{ matrix.qt_arch }}"
        modules: "qtwebengine qtwebchannel qtpositioning"
        cache: true
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
      shell: powershell
    - name: Install dependencies
      run: |
        mkdir build
        curl --fail --location --retry 3 https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-${{ matrix.mpv_arch }}-${{ env.MPV_VERSION }}.7z/download --output mpv.7z
        7z x mpv.7z
        mkdir mpv
        mv include mpv
        gendef libmpv-2.dll
        mv libmpv-2.dll mpv/libmpv-2.dll
        mv libmpv-2.def mpv.def
        mv mpv.def libmpv.dll.a mpv/
        mv mpv build/
        if [ -n "${{ matrix.mpv_arch_fallback }}" ]; then
          curl --fail --location --retry 3 https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-${{ matrix.mpv_arch_fallback }}-${{ env.MPV_VERSION }}.7z/download --output mpv-fallback.7z
          7z x mpv-fallback.7z -ompv-fallback-tmp
          mkdir build/mpv-fallback
          mv mpv-fallback-tmp/libmpv-2.dll build/mpv-fallback/
        fi
      shell: bash
    - name: Bundle VC runtime DLLs
      run: |
        mkdir deps
        mkdir deps/vcruntime
        # Dynamically locate VS installation on runner
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        if (-not $vsPath) {
            $vsPath = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*" | Where-Object { Test-Path "$_\VC\Redist\MSVC" } | Select-Object -First 1).FullName
        }
        $vsRedist = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\${{ matrix.vc_redist_arch }}\Microsoft.VC*.CRT" | Select-Object -First 1
        if (-not $vsRedist) {
            $vsRedist = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Filter "Microsoft.VC*.CRT" | Where-Object { $_.FullName -like "*${{ matrix.vc_redist_arch }}*" } | Select-Object -First 1
        }
        Copy-Item "$vsRedist\*.dll" deps/vcruntime/
        # Also grab VCRedist installer for optional system-wide install
        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile deps/vc_redist.x64.exe
      shell: powershell
    - name: Build
      run: |
        set "VS_PATH="
        for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath 2^>nul') do set "VS_PATH=%%i"
        if not defined VS_PATH (
            for /d %%d in ("C:\Program Files\Microsoft Visual Studio\*") do (
                for /d %%e in ("%%d\*") do (
                    if exist "%%e\VC\Auxiliary\Build\${{ matrix.vcvars }}" set "VS_PATH=%%e"
                )
            )
        )
        call "%VS_PATH%\VC\Auxiliary\Build\${{ matrix.vcvars }}" || exit /b 1
        cd build
        set PATH=%PATH%;C:\Program Files (x86)\Inno Setup 6;%CD%
        set "QT_ROOT_DIR=%QT_ROOT_DIR:\=/%"
        lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:${{ matrix.machine }} || exit /b 1
        cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=output -DQTROOT="%QT_ROOT_DIR%" -DMPV_INCLUDE_DIR="%CD%/mpv/include" -DMPV_LIBRARY="%CD%/mpv/libmpv-2.dll.lib" -DCHECK_FOR_UPDATES=OFF -DUSE_STATIC_MPVQT=ON .. || exit /b 1
        ninja || exit /b 1
        set "PATH=%QT_ROOT_DIR%/bin;%CD%/mpv;%PATH%"
        set "QT_QPA_PLATFORM=offscreen"
        ctest --output-on-failure
        set "TEST_RESULT=%ERRORLEVEL%"
        if exist tests\external-controller-results.txt type tests\external-controller-results.txt
        if not "%TEST_RESULT%"=="0" exit /b %TEST_RESULT%
        node --test ../tests/test_externalvideoplayer.js || exit /b 1
        ninja windows_package || exit /b 1
      shell: cmd
    - name: Verify installer and installed application
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $installer = Get-ChildItem build/JellyfinDesktop-*.exe
        if (@($installer).Count -ne 1) { throw 'Expected exactly one installer' }
        $destination = Join-Path $env:RUNNER_TEMP 'jellyfin-external-player-test'
        $setup = Start-Process $installer.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$destination`"" -Wait -PassThru
        if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
        foreach ($relative in @('Jellyfin Desktop.exe', 'Qt6Core.dll', 'Qt6Network.dll', 'Qt6Xml.dll', 'platforms/qwindows.dll', 'QtWebEngineProcess.exe', 'resources/icudtl.dat', 'qml/QtWebEngine', 'libmpv-2.dll', 'vcruntime140.dll', 'msvcp140.dll')) {
          if (!(Test-Path (Join-Path $destination $relative))) { throw "Missing installed file: $relative" }
        }
        # Verify startup without relying on the build machine's Qt installation.
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '(?i)[/\\]Qt[/\\]' }) -join ';'
        Remove-Item Env:QT_PLUGIN_PATH, Env:QML_IMPORT_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
        $check = Start-Process (Join-Path $destination 'Jellyfin Desktop.exe') -ArgumentList '--help' -PassThru
        if (!$check.WaitForExit(30000)) { $check.Kill(); throw 'Installed application startup timed out' }
        if ($check.ExitCode -ne 0) { throw "Installed application failed: $($check.ExitCode)" }
    - name: Archive installer
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-installer
        path: ${{ github.workspace }}/build/JellyfinDesktop-*.exe
        if-no-files-found: error
