name: build-macos

on:
  workflow_call:
    inputs:
      include_intel:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      include_intel:
        description: Also build an Intel Mac package
        type: boolean
        default: true
  push:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.include_intel == false && '[{"runner":"macos-15","artifact":"macos-arm64"}]' || '[{"runner":"macos-15","artifact":"macos-arm64"},{"runner":"macos-15-intel","artifact":"macos-x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Qt
      uses: jurplel/install-qt-action@v4.4.1
      with:
        # using older version due to severe memory leak
        # https://qt-project.atlassian.net/browse/QTBUG-141377https://qt-project.atlassian.net/browse/QTBUG-141377
        #version: '6.10.1'
        version: '6.9.3'
        arch: clang_64
        modules: 'qtwebengine qtwebchannel qtpositioning qtserialport'
        cache: true
    - name: Install dependencies
      run: |
        brew install mpv
    - name: Release build
      run: |
        cmake -B build -G Ninja \
          -DQTROOT="$QT_ROOT_DIR" \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
          -DCMAKE_INSTALL_PREFIX=build/output \
          -DCHECK_FOR_UPDATES=OFF \
          -DUSE_STATIC_MPVQT=ON
        cmake --build build --parallel 3
        QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
        node --test tests/test_externalvideoplayer.js
        cmake --install build
    - name: Verify bundled dependencies
      run: python3 scripts/verify_macos_bundle.py "build/output/Jellyfin Desktop.app" --arch "$(uname -m)" --max-macos 15.0
    - name: Sign and create dmg
      run: |
        codesign --force --deep -s - "./build/output/Jellyfin Desktop.app/"
        codesign --verify --deep --strict --verbose=2 "./build/output/Jellyfin Desktop.app/"
        env -u QT_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH \
          "./build/output/Jellyfin Desktop.app/Contents/MacOS/Jellyfin Desktop" --help
        brew install create-dmg
        VERSION=$(cat VERSION)
        ARCH=$(uname -m)
        DMG_NAME="JellyfinDesktop-${VERSION}-${ARCH}.dmg"
        create-dmg \
          --volname "Jellyfin Desktop v${VERSION}" \
          --no-internet-enable \
          --window-size 500 300 \
          --icon-size 100 \
          --icon "Jellyfin Desktop.app" 125 150 \
          --app-drop-link 375 150 \
          "${DMG_NAME}" "./build/output/Jellyfin Desktop.app"
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ${{ github.workspace }}/JellyfinDesktop-*.dmg
        if-no-files-found: error
